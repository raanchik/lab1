[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-lab-declaration"
version = "0.1.0"
description = "Третий анализатор для защиты ЛР 1: AI-декларация"
requires-python = ">=3.12"
dependencies = ["school-lab"]

# Всё подключение: имя в группе school_lab.analyzers -> фабрика.
# Имя (declaration) обязано совпадать с analyzer_id.
[project.entry-points."school_lab.analyzers"]
declaration = "school_lab_declaration:DeclarationAnalyzer"

[tool.setuptools.packages.find]
where = ["src"]
