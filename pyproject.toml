[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-lab"
version = "0.1.0"
description = "ЛР 1: приём сдач и расширяемые анализаторы (траектория Python Core)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []  # только стандартная библиотека

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]

[project.scripts]
school-lab = "school_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
school_lab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.mypy]
python_version = "3.12"
strict = true
